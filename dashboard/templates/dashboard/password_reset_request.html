{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password | {{ site.site_name }}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Inter',sans-serif;background:#14291d;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .box{background:#fff;border-radius:1rem;padding:2.5rem;width:100%;max-width:23rem;margin:1rem;}
  h1{font-size:1.15rem;margin:0 0 .35rem;}
  p.sub{color:#6b7d72;font-size:.85rem;margin:0 0 1.5rem;line-height:1.5;}
  label{display:block;font-size:.8rem;font-weight:600;margin-bottom:.35rem;}
  input{width:100%;padding:.65rem .85rem;border:1px solid #e6ece8;border-radius:.55rem;font-family:inherit;font-size:.88rem;margin-bottom:1.1rem;box-sizing:border-box;}
  button{width:100%;padding:.75rem;border:none;border-radius:.6rem;background:#3A7D44;color:#fff;font-weight:700;font-size:.9rem;cursor:pointer;}
  .msg{border-radius:.5rem;padding:.7rem .9rem;font-size:.8rem;margin-bottom:1rem;}
  .msg.error{background:#fbe9e7;color:#c0453d;}
  .msg.success{background:#e9f4ea;color:#3A7D44;}
  .back{display:block;text-align:center;margin-top:1.1rem;color:#6b7d72;font-size:.8rem;text-decoration:none;}
</style>
</head>
<body>
  <div class="box">
    <h1>Reset your password</h1>
    <p class="sub">Enter the email on your staff dashboard account and we'll send a link to reset your password.</p>
    {% for message in messages %}<div class="msg {{ message.tags }}">{{ message }}</div>{% endfor %}
    <form method="post">
      {% csrf_token %}
      <label for="{{ form.email.id_for_label }}">Email</label>
      <input type="email" name="{{ form.email.html_name }}" id="{{ form.email.id_for_label }}" required autofocus>
      <button type="submit">Send Reset Link</button>
    </form>
    <a class="back" href="{% url 'dashboard:login' %}">&larr; Back to login</a>
  </div>
</body>
</html>
