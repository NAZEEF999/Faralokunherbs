{% extends "base.html" %}
{% load static %}
{% block content %}
<section style="padding-top:9rem;padding-bottom:7rem;min-height:70vh;display:flex;align-items:center;">
  <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <img src="{% static 'img/fv-mark.png' %}" alt="{{ site.site_name }}" style="width:4.5rem;height:4.5rem;margin:0 auto 2rem;"/>
    <p style="font-family:'Cormorant Garamond',serif;font-size:5rem;line-height:1;color:#C49A3C;font-weight:700;margin-bottom:1rem;">404</p>
    <h1 style="font-family:'Cormorant Garamond',serif;font-size:clamp(1.5rem,4vw,2.25rem);color:#14291D;font-weight:700;margin-bottom:1rem;">This page has wandered off</h1>
    <p class="muted-text" style="font-size:1rem;line-height:1.75;margin-bottom:2.5rem;max-width:28rem;margin-left:auto;margin-right:auto;">
      We couldn't find the page you were looking for. It may have moved, or the link might not be quite right.
    </p>
    <div class="flex flex-wrap gap-4 justify-center">
      <a href="{% url 'api:home' %}" class="btn-primary">Back to Home</a>
      <a href="{% url 'api:products' %}" class="btn-ghost">Browse Products</a>
    </div>
  </div>
</section>
{% endblock %}
