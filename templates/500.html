<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Something went wrong</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body{margin:0;font-family:'DM Sans',sans-serif;background:#14291D;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#E8F0E9;}
    .box{text-align:center;max-width:26rem;margin:1.5rem;}
    h1{font-family:'Cormorant Garamond',serif;font-size:2rem;margin:1.5rem 0 1rem;}
    p{color:#A0B5A3;line-height:1.7;margin-bottom:2rem;}
    a{display:inline-block;padding:.75rem 1.75rem;border-radius:.5rem;background:linear-gradient(135deg,#3A7D44,#1E4A26);color:#fff;text-decoration:none;font-weight:500;}
  </style>
</head>
<body>
  <div class="box">
    <div style="width:3.5rem;height:3.5rem;border-radius:50%;background:rgba(196,154,60,.15);border:1px solid rgba(196,154,60,.4);display:flex;align-items:center;justify-content:center;margin:0 auto;">
      <span style="color:#C49A3C;font-size:1.5rem;">!</span>
    </div>
    <h1>Something went wrong on our end</h1>
    <p>We've hit a snag loading this page. Please try again in a moment — if it keeps happening, let us know.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
